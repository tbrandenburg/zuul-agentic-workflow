# Phase 3 (plan §7.6, task 3.1): shared run-phase playbook for every job
# whose parent is the abstract `agent` job (planner-agent, coder-agent).
# hosts: localhost - executor-only, no nodeset (plan §1.10, real
# agent-runner node lands in Phase 4).
#
# Design notes (documented per the task brief):
# - run_id/task/repo/base_ref come EXCLUSIVELY from the `agent_result_initialize`
#   flat Ansible var returned by the initializer (extended in this phase -
#   see init-run.yaml) - never by re-reading runs/<id>/request.json off disk,
#   even though that file is technically still reachable at
#   {{ zuul.executor.work_root }}/{{ zuul.project.src_dir }} in this PoC. Going
#   through the Zuul-documented data-passing mechanism keeps a single source
#   of truth and matches how planner->coder state passing works (task 3.3).
# - coder-agent's upstream_results is built ONLY from the namespaced
#   `agent_result_planner` var (task 3.2/3.3) - never from any stdout/console
#   log file. See zuul/scripts/prove-no-stdout-leak.sh for the empirical
#   proof (task 3.5).
# - agent_model is a job var (default set on the abstract `agent` job,
#   overridable per job/project) - "the model name is configuration, not
#   hardcoded" per plan §7.5/§7.6.
# - agent_mock is read from the run request itself
#   (agent_result_initialize.mock, see init-run.yaml/jobs.yaml) so a single
#   push can opt into a zero-cost dry run; there are no separate "-mock"
#   job variants (see docs/PLAN.md Phase 3 notes for why an earlier design
#   with such variants didn't actually work).
- hosts: localhost
  gather_facts: false
  vars:
    agent_result_dir: "{{ agent_artifacts_dir }}/{{ agent_role }}"
  tasks:
    - name: Create per-build working directories
      file:
        path: "{{ item }}"
        state: directory
        mode: "0755"
      loop:
        - "{{ agent_input_path | dirname }}"
        - "{{ agent_workspace_path }}"
        - "{{ agent_result_dir }}"

    - name: Compose upstream_results for this role (task 3.2/3.3, extended Phase 5 task 5.1)
      # coder-agent's upstream_results contains EXACTLY one entry, built
      # solely from the flat `agent_result_planner` var (fact #2/§1.3: not
      # namespaced under any zuul.parent_data-style structure). reviewer-
      # agent's upstream_results contains TWO entries - agent_result_coder
      # AND agent_result_validation (task 5.1) - so the reviewer sees both
      # what the coder claims to have done and the deterministic
      # tool-validation verdict. planner-agent has no upstream (it is the
      # first agent role) so this stays [].
      set_fact:
        upstream_results: >-
          {{
            ([{
              'role': 'planner',
              'summary': vars['agent_result_planner'].summary,
              'artifact_url': vars['agent_result_planner'].artifact_url,
              'status': vars['agent_result_planner'].status
            }] if agent_role == 'coder' else
            [{
              'role': 'coder',
              'summary': vars['agent_result_coder'].summary,
              'artifact_url': vars['agent_result_coder'].artifact_url,
              'status': vars['agent_result_coder'].status
            }, {
              'role': 'validation',
              'summary': vars['agent_result_validation'].summary,
              'artifact_url': vars['agent_result_validation'].artifact_url,
              'status': vars['agent_result_validation'].status
            }] if agent_role == 'reviewer' else [])
          }}

    - name: Fetch the validation report for the reviewer role (task 5.1)
      # Passed via agent-input.schema.json's existing `validation` field
      # (already defined since Phase 2, never used until now) rather than
      # inventing a new schema field - the reviewer prompt already renders
      # `input.validation` verbatim (packages/agent-runtime/src/prompt.ts).
      # Read directly off the shared `logs` Docker volume, same
      # http://localhost:8000/... -> /srv/static/logs/... substitution
      # pattern as validate-result.yaml (that hostname:port does not
      # resolve from inside the executor container's network namespace).
      when: agent_role == 'reviewer'
      set_fact:
        reviewer_validation_report: "{{ lookup('file', (vars['agent_result_validation'].artifact_url | regex_replace('^http://localhost:8000/', '/srv/static/logs/'))) | from_json }}"

    - name: Default validation report to null for non-reviewer roles
      set_fact:
        reviewer_validation_report: null
      when: agent_role != 'reviewer'

    - name: Clone the target repo into a throwaway, per-build workspace (Phase 4, task 4.2)
      # Only the coder needs a real, patchable git checkout - planner works
      # off summaries only and never touches a workspace. Cloning /repo
      # (the trusted, read-only bind mount of this whole monorepo) rather
      # than the untrusted agent-runs project: sandbox/services/example (the
      # coder's target repo) lives in THIS repo, not in agent-runs. This
      # clone is itself throwaway (lives under /tmp/{{ zuul.build }}, wiped
      # with the rest of the build workspace) - it is never /repo itself,
      # so /repo (and therefore sandbox/services/example's real, in-tree
      # copy) is never mutated by a coder run, matching task 4.7's proof.
      when: agent_role == 'coder'
      block:
        - name: git clone /repo into the coder's throwaway workspace
          command: "git -c safe.directory=* clone --quiet --no-hardlinks /repo {{ agent_workspace_path }}/repo-clone"
          environment:
            PATH: /usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
            HOME: /root
            GIT_CONFIG_COUNT: "1"
            GIT_CONFIG_KEY_0: safe.directory
            GIT_CONFIG_VALUE_0: "*"

        - name: Checkout the pinned base_sha in the throwaway clone
          command: "git -c safe.directory=* checkout --quiet {{ agent_result_initialize.base_sha }}"
          args:
            chdir: "{{ agent_workspace_path }}/repo-clone"
          environment:
            PATH: /usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
            HOME: /root
            GIT_CONFIG_COUNT: "1"
            GIT_CONFIG_KEY_0: safe.directory
            GIT_CONFIG_VALUE_0: "*"

        - name: Compute the coder's effective workspace path (the service dir inside the clone)
          set_fact:
            coder_service_workspace: "{{ agent_workspace_path }}/repo-clone/{{ agent_result_initialize.repo }}"

    - name: Resolve the effective workspace path/mode passed to agent-runtime (task 4.2/5.5)
      # coder gets a real, writable checkout of its own pinned service dir;
      # every other role keeps the existing read-only empty scratch dir
      # (unchanged from Phase 3 - no functional change for planner).
      set_fact:
        effective_workspace_path: "{{ coder_service_workspace if agent_role == 'coder' else agent_workspace_path }}"
        effective_workspace_mode: "{{ 'read-write' if agent_role == 'coder' else 'read-only' }}"

    - name: Resolve the effective model (Phase 6, task 6.3 - request-level override)
      # A request-level `model` (task-request.schema.json's optional field,
      # threaded through by init-run.yaml as agent_result_initialize.model)
      # takes precedence over the job-level `agent_model` default. Empty
      # string means "no override" (see init-run.yaml's comment on why it
      # cannot use Jinja `omit` inside a zuul_return data mapping).
      set_fact:
        effective_agent_model: "{{ agent_result_initialize.model if (agent_result_initialize.model | default('', true) | length > 0) else agent_model }}"

    - name: Build the agent-input manifest matching agent-input.schema.json (task 3.1)
      # Phase 6 hardening finding: `limits.timeout_ms` was never set here
      # before, so agent-runtime always fell back to its own
      # DEFAULT_TIMEOUT_MS (900s/15min). Since ExitCode.TIMEOUT is
      # retryable up to max_attempts (default 3), the WORST-CASE
      # wall-clock budget for a single hung model call was 3 x 900s =
      # 2700s - which exceeds the abstract `agent` job's own 1800s
      # Zuul-level timeout. In that situation Zuul's outer job timeout
      # always fires first (TIMED_OUT at the job level), silently masking
      # agent-runtime's own bounded, explicit exit-21 mechanism -
      # reproduced live in this phase (see docs/PLAN.md's Phase 6 notes).
      # Fixed by explicitly bounding timeout_ms below so 3 attempts
      # comfortably fit inside the job timeout with margin to spare.
      copy:
        dest: "{{ agent_input_path }}"
        mode: "0644"
        content: |
          {{ {
            'schema_version': 1,
            'run_id': agent_result_initialize.run_id,
            'role': agent_role,
            'task': {
              'description': agent_result_initialize.task,
              'repo': agent_result_initialize.repo,
              'base_ref': agent_result_initialize.base_ref,
              'base_sha': agent_result_initialize.base_sha
            },
            'upstream_results': upstream_results,
            'validation': reviewer_validation_report,
            'workspace': {'path': effective_workspace_path, 'mode': effective_workspace_mode},
            'model': effective_agent_model,
            'limits': {'timeout_ms': 480000}
          } | to_nice_json }}

    - name: Publish the composed agent-input manifest as an artifact (needed by e2e-3's byte-identical proof and by the stdout-isolation proof)
      copy:
        src: "{{ agent_input_path }}"
        dest: "{{ agent_result_dir }}/agent-input.json"
        mode: "0644"
        remote_src: true

    - name: Run agent-runtime (real opencode call unless agent_mock is true)
      # Zuul's Ansible execution scrubs the process environment (security
      # hardening) before running playbooks, so PATH is NOT the docker
      # image's `PATH=/opt/node/bin:/opt/opencode-bin:...` (compose env only
      # sets the container's own PID-1 env, not what Ansible passes to
      # `command:`). Use the absolute path to node AND still set
      # `environment:` so node's own process.env.PATH (inherited by
      # `child_process.spawn('opencode')` in
      # packages/agent-runtime/src/opencode.ts) can find the opencode
      # binary.
      command: >-
        /opt/node/bin/node /repo/packages/agent-runtime/dist/cli.js run
        --role {{ agent_role }}
        --input {{ agent_input_path }}
        --output {{ agent_output_path }}
        --prompt /repo/{{ prompt_file }}
        --model {{ effective_agent_model }}
        --workspace {{ effective_workspace_path }}
        --artifacts {{ agent_result_dir }}
        {{ '--mock' if (agent_mock | default(false) | bool) else '' }}
      environment:
        PATH: /opt/node/bin:/opt/opencode-bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
        HOME: /root
      register: agent_run
      failed_when: agent_run.rc not in [0]

    - name: Write the standalone independent schema-check script (task 3.4)
      # Deliberately does NOT reuse packages/agent-tools (empty Phase-4
      # scaffold, out of scope this phase) - it reuses the already-built
      # @repo/agent-contracts package instead, which is the simplest option
      # that still gives a genuinely independent (playbook-side, not
      # runtime-side) schema check.
      copy:
        dest: "/tmp/{{ zuul.build }}/check-agent-result.mjs"
        mode: "0644"
        content: |
          import { readFileSync } from "node:fs";
          import { validateAgentResult, formatErrors } from "/repo/packages/agent-contracts/dist/index.js";
          const path = process.argv[2];
          const data = JSON.parse(readFileSync(path, "utf-8"));
          const result = validateAgentResult(data);
          if (!result.valid) {
            console.error(`agent-result.json failed independent schema validation: ${formatErrors(result.errors)}`);
            process.exit(1);
          }
          console.log(JSON.stringify({ status: data.status, summary: data.summary }));

    - name: Independently validate agent-result.json against the schema (task 3.4)
      command: "/opt/node/bin/node /tmp/{{ zuul.build }}/check-agent-result.mjs {{ agent_output_path }}"
      environment:
        PATH: /opt/node/bin:/opt/opencode-bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
        HOME: /root
      register: schema_check
      changed_when: false
      failed_when: schema_check.rc not in [0]

    - name: Parse the independently-validated result
      set_fact:
        checked_result: "{{ schema_check.stdout | from_json }}"

    - name: Copy the agent-result.json into the artifacts dir (task 3.1 step 4)
      copy:
        src: "{{ agent_output_path }}"
        dest: "{{ agent_result_dir }}/agent-result.json"
        mode: "0644"
        remote_src: true

    - name: (mock only) simulate the coder's file edit deterministically (Phase 4, task 4.8 mock path)
      # agent-runtime --mock replays a recorded NDJSON transcript and never
      # touches the filesystem (packages/agent-runtime/src/mock.ts) - there
      # is therefore no real model edit to diff in mock mode. This
      # playbook-level, deterministic stand-in edit is what lets
      # `phase4-e2e-mock` exercise the SAME patch-generation/tool-validation
      # path as a real run, at zero model cost, without inventing new
      # agent-runtime code paths for something the mock CLI flag was never
      # meant to do (simulate filesystem writes).
      when: agent_role == 'coder' and (agent_mock | default(false) | bool)
      blockinfile:
        path: "{{ coder_service_workspace }}/index.js"
        marker: "// {mark} MOCK CODER EDIT (phase4-e2e-mock)"
        insertbefore: BOF
        block: |
          // mock-coder: deterministic comment inserted by run-agent.yaml for phase4-e2e-mock.

    - name: Generate patch.diff against base_sha (Phase 4, task 4.2)
      when: agent_role == 'coder'
      command: "git -c safe.directory=* diff --no-color {{ agent_result_initialize.base_sha }} -- {{ agent_result_initialize.repo }}"
      args:
        chdir: "{{ agent_workspace_path }}/repo-clone"
      register: coder_patch_diff
      changed_when: false
      environment:
        PATH: /usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
        HOME: /root
        GIT_CONFIG_COUNT: "1"
        GIT_CONFIG_KEY_0: safe.directory
        GIT_CONFIG_VALUE_0: "*"

    - name: Publish patch.diff as a build artifact (Phase 4, task 4.2)
      when: agent_role == 'coder'
      copy:
        dest: "{{ agent_result_dir }}/patch.diff"
        content: "{{ coder_patch_diff.stdout }}\n"
        mode: "0644"

    - name: Publish artifacts and return the compact, namespaced summary (task 3.1 step 4 / §7.6)
      # Dynamic key ("agent_result_" ~ agent_role) built via a Jinja
      # dict literal since zuul_return's `data:` mapping cannot use a Jinja
      # expression as a literal YAML key. Phase 4: coder additionally
      # returns `patch_url` (and an extra zuul.artifacts entry) using the
      # SAME "http://localhost:8000/..." URL shape as artifact_url -
      # tool-validation (a separate build) resolves this to the equivalent
      # /srv/static/logs/... path on the shared `logs` Docker volume rather
      # than an actual HTTP call (see validate-result.yaml's own comment
      # for why "localhost:8000" doesn't resolve from inside a container).
      vars:
        base_result_payload:
          role: "{{ agent_role }}"
          status: "{{ checked_result.status }}"
          summary: "{{ checked_result.summary }}"
          artifact_url: "http://localhost:8000/{{ zuul.build }}/artifacts/{{ agent_role }}/agent-result.json"
        result_payload: >-
          {{
            base_result_payload | combine(
              {'patch_url': 'http://localhost:8000/' ~ zuul.build ~ '/artifacts/coder/patch.diff'}
              if agent_role == 'coder' else {}
            )
          }}
        base_artifacts:
          - name: "{{ agent_role }} result"
            url: "artifacts/{{ agent_role }}/agent-result.json"
        extra_artifacts: >-
          {{
            [{'name': 'patch', 'url': 'artifacts/coder/patch.diff'}] if agent_role == 'coder' else []
          }}
      zuul_return:
        data: >-
          {{
            {('agent_result_' ~ agent_role): result_payload,
             'zuul': {'artifacts': base_artifacts + extra_artifacts}}
          }}
