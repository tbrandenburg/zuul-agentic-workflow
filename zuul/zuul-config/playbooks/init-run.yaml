- hosts: localhost
  gather_facts: false
  vars:
    triggering_worktree: "{{ zuul.executor.work_root }}/{{ zuul.project.src_dir }}"
  tasks:
    - name: Discover files changed by the triggering commit
      command: "git diff-tree --no-commit-id --name-only -r {{ zuul.newrev }}"
      args:
        chdir: "{{ triggering_worktree }}"
      register: changed_files
      changed_when: false

    - name: Identify the runs/<run_id>/request.json touched by this commit
      set_fact:
        run_request_rel_path: >-
          {{ (changed_files.stdout_lines | select('match', '^runs/[^/]+/request\.json$') | list | first) | default('', true) }}

    - name: Attempt to read and parse the run request (best-effort; validated below)
      set_fact:
        run_request: "{{ lookup('file', triggering_worktree ~ '/' ~ run_request_rel_path) | from_json }}"
      when: run_request_rel_path != ''
      register: run_request_parse
      ignore_errors: true

    - name: Determine whether the run request is valid (present, parseable JSON, required keys)
      set_fact:
        run_request_valid: >-
          {{
            run_request_rel_path != '' and
            (run_request_parse is not failed) and
            (['task', 'repo', 'base_ref'] | difference((run_request | default({})).keys() | list)) == []
          }}

    - name: Prune the job graph and fail with a clear reason (invalid or missing run request)
      when: not run_request_valid
      block:
        - name: Skip all downstream jobs (fail-fast per plan §1.2/§1.4)
          zuul_return:
            data:
              zuul:
                child_jobs: []

        - name: Report why the run request was rejected
          fail:
            msg: >-
              Invalid or missing runs/<run_id>/request.json for newrev
              {{ zuul.newrev }}. Path checked: '{{ run_request_rel_path }}'.
              Changed files in commit: {{ changed_files.stdout_lines }}.

    - name: Publish the validated request as a build artifact and let the graph continue
      when: run_request_valid
      block:
        - name: Write the validated run request to the per-build artifacts directory
          copy:
            content: "{{ run_request | to_nice_json }}"
            dest: "{{ agent_artifacts_dir }}/run-request.json"
            mode: "0644"

        - name: Resolve base_sha for the target repo from the trusted /repo mount (Phase 4, task 4.2)
          # sandbox/services/example (the coder's target repo) lives INSIDE
          # this same monorepo, bind-mounted read-only at /repo - not inside
          # the agent-runs project this initializer's own worktree belongs
          # to. Resolving base_ref -> base_sha here (once, at initializer
          # time) is what lets every downstream job (coder-agent,
          # tool-validation) patch against a single PINNED commit rather
          # than a moving branch tip, per plan §6/§4.2.
          command: "git -c safe.directory=* -C /repo rev-parse {{ run_request.base_ref }}"
          register: base_sha_result
          changed_when: false
          environment:
            PATH: /usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
            HOME: /root
            GIT_CONFIG_COUNT: "1"
            GIT_CONFIG_KEY_0: safe.directory
            GIT_CONFIG_VALUE_0: "*"

        - name: Return the run-request artifact reference (combined with log_url by Zuul)
          zuul_return:
            data:
              # Phase 3 (task 3.1): namespaced per plan §1.3 so run-agent.yaml
              # can read the validated request's run_id/task/repo/base_ref
              # without re-parsing runs/<id>/request.json itself. Follows the
              # same "agent_result_<role>" naming convention even though this
              # producer is the initializer, not an agent role, to keep a
              # single lookup convention across the whole graph.
              agent_result_initialize:
                run_id: "{{ run_request_rel_path.split('/')[1] }}"
                task: "{{ run_request.task }}"
                repo: "{{ run_request.repo }}"
                base_ref: "{{ run_request.base_ref }}"
                # Phase 4 (task 4.2/4.3): pinned commit SHA the coder patches
                # against and tool-validation's check 3 applies against.
                base_sha: "{{ base_sha_result.stdout | trim }}"
                # Phase 4 (task 4.4): threaded through to agent-tools'
                # allowlist check (defaults to [] -> "anything under the
                # repo's own service dir", see packages/agent-tools/src
                # /allowlist.ts's resolveAllowedPaths doc comment).
                allowed_paths: "{{ run_request.allowed_paths | default([]) }}"
                # Opt-in, zero-cost dry-run switch (fixes a Phase 3 defect:
                # see docs/PLAN.md Phase 3 notes - agent-model-invoking jobs
                # used to run unconditionally on every push, which silently
                # cost real tokens even for infra-only regression checks).
                # Not part of task-request.schema.json (no strict schema
                # validation of request.json content yet, only required-key
                # presence - see Phase 1 notes); defaults to false so any
                # request omitting it behaves as a real run, unchanged.
                mock: "{{ run_request.mock | default(false) }}"
                # Phase 4: lets tool-validation fetch the exact request.json
                # this run validated (for its allowed_paths default logic)
                # without re-deriving the initializer's own build id.
                request_artifact_url: "http://localhost:8000/{{ zuul.build }}/artifacts/run-request.json"
              zuul:
                artifacts:
                  - name: run-request
                    url: artifacts/run-request.json
