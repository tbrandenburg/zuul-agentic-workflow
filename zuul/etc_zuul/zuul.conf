[zookeeper]
hosts=zk:2281
tls_cert=/var/certs/certs/client.pem
tls_key=/var/certs/keys/clientkey.pem
tls_ca=/var/certs/certs/cacert.pem

[keystore]
password=secret

[scheduler]
tenant_config=/etc/zuul/main.yaml

[connection agent-git]
driver=git
baseurl=git://gitserver/
poll_delay=60

[database]
# Password supplied via variable interpolation from the compose environment.
dburi=mariadb+pymysql://zuul:%(ZUUL_MYSQL_PASSWORD)s@mysql/zuul

[web]
listen_address=0.0.0.0
port=9000
root=http://localhost:9000

[executor]
private_key_file=/var/certs/executor_id_rsa
trusted_rw_paths=/srv/static/logs:/root/.local/share/opencode
# Phase 3: trusted (config-project) playbooks run inside a bubblewrap
# sandbox that, by default, only bind-mounts /usr,/lib,/bin,/sbin plus the
# job's own work/ansible dirs (zuul/driver/bubblewrap) - NOT the executor
# container's /repo, /opt/node, /opt/opencode-bin bind mounts added for
# this phase's PoC-only "real opencode CLI on the host's PATH" convenience.
# Without this, `command: node /repo/...` and node's own
# `child_process.spawn('opencode')` both fail with ENOENT even though
# `docker exec ... node --version` works fine outside the sandbox.
trusted_ro_paths=/repo:/opt/node:/opt/opencode-bin

[auth zuul_operator]
driver=HS256
allow_authz_override=true
realm=zuul.local
client_id=zuul.local
issuer_id=zuul_operator
secret=exampleSecretPhase0

[webclient]
url=http://localhost:9000
verify_ssl=false
